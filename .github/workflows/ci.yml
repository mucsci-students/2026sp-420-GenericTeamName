name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # v5 uses Node.js 24
      - name: Checkout code
        uses: actions/checkout@v5

      # v6 uses Node.js 24 and supports Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgles2 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicitly install testing plugins to ensure fixtures like 'mocker' and 'qtbot' work
          pip install pytest pytest-cov pytest-mock pytest-qt PyQt6
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with coverage
        env:
          # Forces Qt to use the offscreen rendering backend
          QT_QPA_PLATFORM: offscreen
          # Prevents crashes related to hardware acceleration in CI
          QT_QUICK_BACKEND: software
        run: xvfb-run pytest --cov=. --cov-report=xml

      # v6 uses Node.js 24
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: truename: Workflow for Codecov example-python

on: [push, pull_request]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # v5 uses Node 24
      - name: Checkout
        uses: actions/checkout@v5

      # v6 uses Node 24 and supports Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Fixes the ImportError: libEGL.so.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgles2 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and collect coverage
        # xvfb-run provides the virtual display for PyQt6
        run: xvfb-run pytest --cov=. --cov-report=xml

      # v6 uses Node 24
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
